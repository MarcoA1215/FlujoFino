name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-and-build:
    name: Lint, Test & Build (FinoWork)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install

      - name: Run Backend Unit Tests
        run: yarn --cwd apps/backend test --runInBand

      - name: Build Backend (NestJS)
        run: yarn --cwd apps/backend build

      - name: Build Frontend (Vite & React)
        run: yarn --cwd apps/frontend build
