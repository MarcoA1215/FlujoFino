name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  validate-and-build:
    name: Lint, Test & Build (FinoWork)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack & Yarn Berry
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install Dependencies
        run: yarn install

      - name: Build Shared Types
        run: yarn workspace @finowork/shared-types build

      - name: Run Backend Unit Tests
        run: yarn workspace finowork-backend test --runInBand

      - name: Build Backend (NestJS)
        run: yarn workspace finowork-backend build

      - name: Build Frontend (Vite & React)
        run: yarn workspace frontend build
